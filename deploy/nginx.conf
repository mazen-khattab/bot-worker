# Install as /etc/nginx/sites-available/bot-worker and enable it in sites-enabled.
# Certbot adds the HTTPS certificate and HTTP-to-HTTPS redirect afterwards.
server {
    listen 80;
    server_name worker.naafez.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
